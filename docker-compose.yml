services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: drawtrail
      POSTGRES_USER: drawtrail
      POSTGRES_PASSWORD: drawtrail
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drawtrail -d drawtrail']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    ports:
      - '${VALHALLA_PORT:-8002}:8002'
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/europe/andorra-latest.osm.pbf}
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
      build_admins: 'True'
      build_time_zones: 'False'
      build_transit: 'False'
      build_elevation: 'False'
      build_tar: 'True'
      serve_tiles: 'True'
      tileset_name: valhalla_tiles
    volumes:
      - valhalla_tiles:/custom_files
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --globoff --fail --silent --show-error
          'http://127.0.0.1:8002/route?json={"locations":[{"lat":45.764,"lon":4.8357},{"lat":45.768,"lon":4.841}],"costing":"pedestrian","units":"kilometers"}'
          > /dev/null 2>&1 || curl --globoff --fail --silent --show-error
          'http://127.0.0.1:8002/route?json={"locations":[{"lat":42.5063,"lon":1.5218},{"lat":42.5092,"lon":1.5342}],"costing":"pedestrian","units":"kilometers"}'
          > /dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15m

volumes:
  postgres_data:
  redis_data:
  valhalla_tiles:
